name: Refresh Naiwa contribution graph

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naiwa-contribution-graph

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render light and dark Naiwa graphs
        uses: Sur1ive/contribution-fx@0c7303e3949901701337755cacef30ba2674130b # v1.3.1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/naiwa.svg?theme=naiwa
            dist/naiwa-dark.svg?theme=naiwa&mode=dark

      - name: Publish the graphs
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: naiwa-assets
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
